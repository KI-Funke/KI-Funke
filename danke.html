<style>
  /* Gleiches Design wie die Startseite; Schriften liegen auf dem eigenen Server (keine Verbindung zu Google Fonts) */
  @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/schibsted-grotesk.woff2) format("woff2"); }
  @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/anton.woff2) format("woff2"); }
  @font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/caveat.woff2) format("woff2"); }
  :root { color-scheme: dark; --grund: #07080b; --karte: #14161b; --text: #f3f1ec; --grau: #a9adb5; --linie: #262931; --glut: #ff5a1f; --glut-hell: #ff7a45; --anton: "Anton", "Arial Narrow", Impact, sans-serif; --rand: clamp(16px, 4vw, 40px); --ease: cubic-bezier(.2, .7, .1, 1); }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--grund); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--grund); color: var(--text); font: 400 17px/1.6 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  a { color: inherit; text-underline-offset: 3px; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--glut); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 var(--rand); }
  header { border-bottom: 1px solid var(--linie); background: rgba(7, 8, 11, .78); }
  .nav { display: flex; align-items: center; gap: 16px; height: 68px; }
  .marke { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.125rem; letter-spacing: -.02em; text-decoration: none; margin-right: auto; }
  .marke svg { width: 28px; height: 28px; flex: none; color: var(--glut); }
  .zurueck { display: inline-flex; align-items: center; min-height: 44px; color: var(--grau); text-decoration: none; font-weight: 500; }
  .zurueck:hover { color: var(--text); }
  main { position: relative; isolation: isolate; flex: 1; display: grid; place-items: center; padding: clamp(56px, 8vw, 112px) 0; }
  main::before { content: ""; position: absolute; z-index: -1; inset: 0; pointer-events: none; background: radial-gradient(55% 50% at 50% 0%, rgba(255, 90, 31, .26), transparent 70%); }
  .karte { max-width: 620px; margin: 0 auto; padding: clamp(32px, 5vw, 48px) clamp(22px, 4vw, 44px); text-align: center; border: 1px solid var(--linie); border-radius: 24px; background: var(--karte); box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8); }
  .haken { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 50%; background: var(--glut); color: var(--grund); animation: auftauchen .5s var(--ease) both; }
  .haken svg { width: 34px; height: 34px; }
  h1 { margin: 0 0 14px; font-family: var(--anton); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; line-height: 1; font-size: clamp(2.4rem, 7vw, 3.6rem); text-wrap: balance; }
  .hand { display: inline-block; font-family: "Caveat", "Segoe Script", cursive; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--glut); font-size: 1.1em; line-height: .8; rotate: -3deg; }
  .karte p { color: #d9d7d2; font-size: 1.0625rem; }
  .karte p + p { margin-top: 10px; }
  .kontakt { color: var(--grau); }
  .kontakt a { color: var(--glut-hell); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; margin-top: 28px; padding: 0 24px; border: 2px solid var(--glut); border-radius: 999px; background: var(--glut); color: var(--grund); font-weight: 700; font-size: 16px; line-height: 1; text-decoration: none; transition: background-color .2s, border-color .2s; }
  .btn:hover { background: var(--glut-hell); border-color: var(--glut-hell); }
  footer { background: #040507; color: var(--grau); padding: 28px 0; border-top: 1px solid var(--linie); }
  .fuss { display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; font-size: 1.0625rem; }
  .fuss a, .fuss span { display: inline-flex; align-items: center; min-height: 44px; }
  footer a { color: var(--text); }
  footer a:hover { color: var(--glut-hell); }
  @keyframes auftauchen { from { scale: .6; opacity: 0; } to { scale: 1; opacity: 1; } }
  @media (max-width: 767px) { .nav { height: 60px; } }
  @media (prefers-reduced-motion: reduce) { .haken { animation: none; } }
