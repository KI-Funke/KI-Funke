<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- Chat-Knopf: weiße Sprechblase mit Augen, die nach links und rechts schauen und ab und zu blinzeln -->
  <style>
    .blick { animation: blick 6s ease-in-out infinite; }
    .lid { animation: blinzeln 6s linear infinite; transform-origin: 28px 26px; }
    @keyframes blick {
      0%, 18% { transform: translateX(0); }
      26%, 42% { transform: translateX(-3.5px); }
      52%, 68% { transform: translateX(3.5px); }
      78%, 100% { transform: translateX(0); }
    }
    @keyframes blinzeln {
      0%, 86%, 92%, 100% { transform: scaleY(1); }
      89% { transform: scaleY(.12); }
    }
    @media (prefers-reduced-motion: reduce) { .blick, .lid { animation: none; } }
  </style>
  <path fill="#fff" d="M15 13h26a7 7 0 0 1 7 7v12a7 7 0 0 1-7 7H27l-8 6.5V39h-4a7 7 0 0 1-7-7V20a7 7 0 0 1 7-7z"/>
  <g class="lid">
    <g class="blick" fill="#07080b">
      <ellipse cx="21.5" cy="26" rx="3.4" ry="4.6"/>
      <ellipse cx="34.5" cy="26" rx="3.4" ry="4.6"/>
    </g>
  </g>
</svg>
